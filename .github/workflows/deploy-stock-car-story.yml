name: Deploy Stock Car Story

# Publishes the game to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The site then lives at https://<owner>.github.io/<repo>/

on:
  push:
    branches: [claude/nascar-story-game-w36ol1]
    paths: ["stock-car-story/**", ".github/workflows/deploy-stock-car-story.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the single-file bundle
        working-directory: stock-car-story
        run: node tools/build.js
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r stock-car-story/www/. _site/
          mkdir -p _site/single
          cp stock-car-story/dist/index.html _site/single/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
