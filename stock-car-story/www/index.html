<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Stock Car Story">
<meta name="description" content="Build a stock car racing team from a backyard garage to the Premier Cup. Hire drivers, develop machines, chase the championship.">
<title>Stock Car Story</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="lcd" id="dateLcd">1Y 1M 1W</div>
    <div id="moneyBox">$500K</div>
    <div class="lcd" id="rpBox">RP 20</div>
    <div class="lcd" id="fanBox">100</div>
  </div>

  <div id="objCard">
    <div id="objText">—</div>
    <button id="objBtn">GO</button>
  </div>

  <div id="sceneWrap">
    <canvas id="scene"></canvas>
    <div id="order"></div>
    <div id="dim"></div>
    <button id="speedBtn"><span class="ico">▶</span><span class="lbl">1× SPEED</span></button>
    <div id="raceHud">
      <div class="hb" id="posBadge">P1</div>
      <div class="hb" id="lapBox">LAP 1/30</div>
      <div class="hb" id="spdBox">0 mph</div>
      <button id="raceSpeedBtn">1&times;</button>
      <button id="pitBtn">PIT<span>in</span></button>
      <button id="auraBtn">AURA</button>
    </div>
  </div>

  <div id="toast"></div>

  <nav id="tabbar">
    <button class="tab" id="tabTeam"><span>👥</span>Team</button>
    <button class="tab" id="tabCars"><span>🏎</span>Cars</button>
    <button class="tab" id="tabRace"><span>🏁</span>Race</button>
    <button class="tab" id="tabShop"><span>🔧</span>Build</button>
    <button class="tab" id="tabMore"><span>☰</span>More</button>
  </nav>


</div>

<script src="js/data.js"></script>
<script src="js/track.js"></script>
<script src="js/state.js"></script>
<script src="js/race.js"></script>
<script src="js/sprites.js"></script>
<script src="js/textures.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
