function preRace(trackId, season) {
  const tr = byId(TRACKS, trackId);
  const fee = season ? 0 : tr.fee;
  if (G.money < fee) return toast("Can't afford the entry fee.");
  const pcar = G.cars[G.teams[G.curTeam].car];
  if (pcar && !preRace._ok) {
    const st = carStats(pcar), frac = pcar.dur / st.maxdur;
    if (frac < 0.35) {
      return dlg("Machine is damaged",
        "<div class='small'>#" + pcar.num + " " + esc(pcar.name) + " is at <b class='r'>" + Math.round(frac * 100) +
        "% durability</b>. It will very likely blow up before the finish.<br><br>Repairing costs " +
        fmtK(repairCost(pcar)) + " and takes a week or two.</div>",
        [["Race anyway", () => { closeDlg(); preRace._ok = 1; preRace(trackId, season); preRace._ok = 0; }],
         ["Repair first", () => { closeAllDlg(); startRepair(G.teams[G.curTeam].car); updateChrome(); }],
         ["Cancel", () => { closeAllDlg(); }]]);
    }
  }
  scrStrategy(tr, season, fee);
}

/* The strategy sheet: pick rubber and fuel, then choose an aura. */
function scrStrategy(tr, season, fee) {
  SCR_TR = tr; SCR_SE = season; SCR_FEE = fee;
  closeAllDlg();
  const t = G.teams[G.curTeam];
  const car = G.cars[t.car], drv = G.drivers[t.driver];
  const st = carStats(car);
  let h = "<div class='row'>" + carIcon(car) + "<div class='f1'><b class='b'>" + tr.n + "</b>" +
    "<div class='small dim'>" + SURF[tr.surf] + " · " + tr.mi.toFixed(2) + " mi · " + tr.laps + " laps" +
    (season ? "" : " · entry " + fmtK(fee)) + "</div>" +
    "<div class='small'>" + esc(tr.desc) + "</div></div></div>";
  h += "<div class='small dim'>" + esc(drv.name) + " · energy " + Math.floor(drv.energy) +
    "/100 · machine " + car.dur + "/" + st.maxdur + "</div>";

  h += "<h4>Tyres</h4>" + segBar(Object.keys(TYRES).map(k => [k, TYRES[k].n]), STRAT.tyre, "setTyre");
  h += "<div class='small dim'>" + TYRES[STRAT.tyre].desc + "</div>";
  h += "<h4>Starting mode</h4>" +
    segBar(MODE_ORDER.map(k => [k, MODES[k].ico + " " + MODES[k].n]), STRAT.mode, "setMode");
  h += "<div class='small dim'>" + MODES[STRAT.mode].desc +
    " You can change this any time during the race.</div>";

  /* aura is part of the same decision, not a second button */
  if (anyAura()) {
    const opts = [["none", "None"]];
    for (const c of AURA_ORDER) if (G.auras[c] > 0) opts.push([c, AURAS[c].n + " ×" + G.auras[c]]);
    if (!opts.some(o => o[0] === STRAT.aura)) STRAT.aura = "none";
    h += "<h4>Aura</h4>" + segBar(opts, STRAT.aura || "none", "setAura");
    h += "<div class='small dim'>" + (STRAT.aura && STRAT.aura !== "none"
      ? "Spends one " + AURAS[STRAT.aura].n + " aura for a burst of speed you trigger yourself, worth +" +
        Math.round((AURAS[STRAT.aura].boost - 1) * 100) + "% for " + AURAS[STRAT.aura].dur + " seconds."
      : "Save your auras for training, builds and upgrades.") + "</div>";
  }
  h += "<div class='small' style='margin-top:10px'>You call your own stops with the <b class='b'>PIT</b> " +
    "button during the race — tyres, fuel or both. Stopping under caution costs about half the time.</div>";

  const go = () => {
    const a = (STRAT.aura && STRAT.aura !== "none" && G.auras[STRAT.aura] > 0) ? STRAT.aura : null;
    if (a) G.auras[a]--;
    G.money -= fee; updateChrome(); closeAllDlg();
    enterRaceMode();
    startRace(tr, season, a);
  };
  const btns = [["🏁 START RACE", go]];
  if (!season) btns.push(["Cancel", () => { closeAllDlg(); scrRaces(); }]);
  dlg(season ? "Round " + (season.round + 1) : "Race strategy", h, btns);
}
function setAura(k) { STRAT.aura = k; scrStrategy(SCR_TR, SCR_SE, SCR_FEE); }
function setTyre(k) { STRAT.tyre = k; scrStrategy(SCR_TR, SCR_SE, SCR_FEE); }
function setMode(k) { STRAT.mode = k; scrStrategy(SCR_TR, SCR_SE, SCR_FEE); }
/* Change the mode mid-race from the HUD. */
function cycleMode() {
  if (!R || R.phase !== "green") return;
  const me = R.field[0];
  if (me.done || me.dnf) return;
  const i = MODE_ORDER.indexOf(me.mode);
  me.mode = MODE_ORDER[(i + 1) % MODE_ORDER.length];
  STRAT.mode = me.mode;
  sfx("click");
  banner(MODES[me.mode].n.toUpperCase(), 1.1);
  updateRaceHud();
}
let SCR_TR = null, SCR_SE = null, SCR_FEE = 0;

/* ============================================================
   RECORDS / AURAS / OPTIONS
   ============================================================ */
function scrRecords() {
  closeAllDlg();
  const s = G.stats;
  let h = "<table class='t'>" +
    "<tr><td>Races</td><td><b>" + s.races + "</b></td><td>Wins</td><td><b>" + s.wins + "</b></td></tr>" +
    "<tr><td>Podiums</td><td><b>" + s.podiums + "</b></td><td>Titles</td><td><b>" + s.titles + "</b></td></tr>" +
    "<tr><td>Purse</td><td><b>" + fmtK(s.earned) + "</b></td><td>Upgrades</td><td><b>" + s.upgrades + "</b></td></tr>" +
    "<tr><td>Fans</td><td><b>" + G.fans + "</b></td><td>Clear Pts</td><td><b>" + G.clearPts + "</b></td></tr></table>";
  h += "<h4>Track bests</h4>";
  let any = false;
  TRACKS.forEach(t => {
    const p = G.trophies[t.id]; if (!p) return; any = true;
    h += "<div class='small'>" + (p === 1 ? "🏆" : p === 2 ? "🥈" : "🥉") + " " + t.n + " — best " + ord(p) + "</div>";
  });
  if (!any) h += "<div class='small dim'>No podiums yet.</div>";
  h += "<h4>Championships</h4>";
  SERIES.forEach(sd => { if (G.seriesWon[sd.id]) h += "<div class='small b'>🏆 " + sd.n + " Champion</div>"; });
  if (!G.stats.titles) h += "<div class='small dim'>No titles yet.</div>";
  if (G.log.length) {
    h += "<h4>Shop diary</h4>";
    G.log.slice(-6).reverse().forEach(l => h += "<div class='small dim'>Y" + l.y + " M" + l.m + " — " + esc(l.t) + "</div>");
  }
  dlg("Records", h, [["Close", () => closeAllDlg()]]);
}
function scrAuras() {
  closeAllDlg();
  let h = "<div class='small dim'>Auras are one-shot boosts. Spend them on a race, a build, a part install, an upgrade or a training session.</div>";
  for (const c of AURA_ORDER) {
    const a = AURAS[c];
    h += "<div class='row'><span class='chip' style='background:" + a.col + "'>" + a.n + "</span>" +
      "<div class='f1 small'>work ×" + a.mult + " · race +" + Math.round((a.boost - 1) * 100) + "% for " + a.dur + "s</div>" +
      "<b>×" + G.auras[c] + "</b></div>";
  }
  const d = G.drivers[G.teams[G.curTeam].driver];
  if (d) h += "<div class='small' style='margin-top:6px'>" + esc(d.name) + " currently earns <b style='color:" +
    AURAS[auraTierFor(d)].col + "'>" + AURAS[auraTierFor(d)].n + "</b> auras. Raise their stats for better ones.</div>";
  h += "<div class='small dim' style='margin-top:5px'>Earned by: a first-time podium at a track, winning a championship, driver level milestones, and the occasional test session.</div>";
  dlg("Auras", h, [["Close", () => closeAllDlg()]]);
}
function scrOptions() {
  closeAllDlg();
  const sc = finalScore();
  dlg("Options",
    "<div class='row'><div class='f1'>Sound effects</div><button class='pill' onclick='G.set.sfx=!G.set.sfx;closeAllDlg();scrOptions()'>" + (G.set.sfx ? "ON" : "OFF") + "</button></div>" +
    "<div class='row'><div class='f1'>Save now</div><button class='pill' onclick='toast(saveGame()?\"Saved.\":\"Save failed.\")'>Save</button></div>" +
    "<div class='row'><div class='f1'>Current score</div><b>" + sc.score.toLocaleString() + "</b></div>" +
    "<div class='row'><div class='f1 small'>Library: " + sc.vt + " machines, " + sc.pt + " parts developed</div></div>" +
    "<div class='row'><div class='f1'>Restart (keep library)</div><button class='pill' onclick='confirmRestart(true)'>New+</button></div>" +
    "<div class='row'><div class='f1'>Wipe everything</div><button class='pill' onclick='confirmRestart(false)'>Wipe</button></div>" +
    "<div class='small dim' style='margin-top:6px'>Stock Car Story — an original management sim in the classic Japanese pixel-sim tradition. Art and code are original work.</div>",
    [["Close", () => closeAllDlg()]]);
}
function confirmRestart(keepLib) {
  dlg(keepLib ? "New Game+" : "Wipe Save",
    keepLib ? "Start a fresh career keeping every machine and part level you've developed." :
      "Erase the save <i>and</i> the developed library. This cannot be undone.",
    [["Do it", () => {
      if (!keepLib) { try { localStorage.removeItem(LIBKEY); } catch (e) {} }
      try { localStorage.removeItem(SAVEKEY); } catch (e) {}
      location.reload();
    }], ["Cancel", closeDlg]]);
}
function showEndgame() {
  const r = finalScore();
  dlg("Year 14 — The Final Season",
    "<div class='bigwin'>FINAL SCORE</div><div class='score'>" + r.score.toLocaleString() + "</div>" +
    "<table class='t'>" +
    "<tr><td>Funds</td><td>" + fmtK(G.money) + "</td></tr>" +
    "<tr><td>Race wins</td><td>" + G.stats.wins + "</td></tr>" +
    "<tr><td>Championships</td><td>" + G.stats.titles + "</td></tr>" +
    "<tr><td>Machines developed</td><td>" + r.vt + "</td></tr>" +
    "<tr><td>Parts developed</td><td>" + r.pt + "</td></tr>" +
    "<tr><td>Upgrades</td><td>" + G.stats.upgrades + "</td></tr>" +
    "<tr><td>Total advertising</td><td>" + Math.round(G.stats.adTotal) + "</td></tr></table>" +
    "<div class='small dim' style='margin-top:6px'>Keep playing as long as you like — or start New Game+ from Options to carry your whole library into a fresh career.</div>",
    [["Keep racing", closeDlg]]);
}

/* ============================================================
   NEXT STEP — the game always says what to do and offers the
   one button that does it.  This is the difference between a
   simulation and something a person can actually play.
   ============================================================ */
function nextStep() {
  const t = G.teams[G.curTeam];
  const car = G.cars[t.car], drv = G.drivers[t.driver];

  if (!drv) return { t: "Your team has no driver. Pick one from <b>Team</b>.", b: "Team", f: scrTeam };
  if (!car) return { t: "Your team has no machine. Pick one from <b>Machines</b>.", b: "Machines", f: scrCars };

  const st = carStats(car);
  if (G.repair) return { t: "The crew is repairing the machine — <b>" + G.repair.wks + " week(s)</b> left. Let the clock run.", b: "Wait", f: () => { G.set.paused = false; updateChrome(); } };
  if (car.dur < st.maxdur * 0.35)
    return { t: "#" + car.num + " is <b>badly damaged</b> and will blow up mid-race. Repair it first.", b: "Repair", f: () => { startRepair(t.car); updateChrome(); } };

  if (SEASON) {
    const tr = byId(TRACKS, SEASON.def.tracks[SEASON.round]);
    return { t: SEASON.def.n + " — <b>round " + (SEASON.round + 1) + "</b> at " + tr.n + ".", b: "Race", f: () => nextSeasonRace() };
  }
  if (!G.stats.races)
    return { t: "Time to go racing. Enter <b>Pine Ridge Bullring</b> and see where you stand.", b: "Race", f: scrRaces };

  if (G.offers.length && G.sponsors.length < 2)
    return { t: "A sponsor wants your car. Signing pays twice a year and unlocks new gear.", b: "Sponsors", f: scrSponsors };

  if (drv.energy < 40)
    return { t: esc(drv.name) + " is worn out (" + Math.floor(drv.energy) + "/100). Rest a few weeks before racing.", b: "Wait", f: () => { G.set.paused = false; updateChrome(); } };

  const nc = availableCarBlueprints().filter(c => G.rp >= c.res);
  const np = availablePartBlueprints().filter(p => G.rp >= p.res);
  if (nc.length || np.length)
    return { t: "You can research <b>" + ((nc[0] || np[0]).name) + "</b> with your research data.", b: "Research", f: scrResearch };

  if (car.parts.length < st.exp && G.known.parts.some(id => G.money >= byId(PARTS, id).cost))
    return { t: "#" + car.num + " has an <b>empty part slot</b>. Fitting a part makes it faster.", b: "Parts", f: scrParts };

  const gl = GARAGES[G.garage + 1];
  if (gl && (!gl.req || G.seriesWon[gl.req]) && G.money >= gl.cost)
    return { t: "You can afford the <b>" + gl.n + "</b> — more crew, more machines, more teams.", b: "Upgrade", f: scrResearch };

  const trainable = TRAININGS.filter(x => G.known.trains.includes(x.id) && G.money >= x.c && drv.energy >= x.e);
  if (trainable.length && G.money > 200)
    return { t: "Train " + esc(drv.name) + " — better stats win more races and earn better auras.", b: "Train", f: () => scrTrain(t.driver) };

  const sd = SERIES.filter(s => G.garage >= s.req.garage && !G.seriesWon[s.id] && G.money >= s.fee).pop();
  if (sd) return { t: "Enter the <b>" + sd.n + "</b> — winning it unlocks a bigger garage.", b: "Enter", f: scrRaces };

  return { t: "Pick a race and go earn some money.", b: "Race", f: scrRaces };
}

function refreshObjective() {
  if (!G || MODE !== "shop") { $("objCard").classList.remove("on"); return; }
  if (dlgStack.length) { $("objCard").classList.remove("on"); return; }
  const s = nextStep();
  $("objText").innerHTML = s.t;
  $("objBtn").textContent = s.b;
  $("objBtn").onclick = () => { sfx("click"); s.f(); };
  $("objCard").classList.add("on");
  /* badge the tabs that have something waiting */
  const badge = (id, on) => {
    const el = $(id); if (!el) return;
    let d = el.querySelector("i.dot");
    if (on && !d) { d = document.createElement("i"); d.className = "dot"; el.appendChild(d); }
    else if (!on && d) d.remove();
  };
  badge("tabShop", availableCarBlueprints().some(c => G.rp >= c.res) || availablePartBlueprints().some(p => G.rp >= p.res));
  badge("tabRace", !!SEASON);
  badge("tabMore", G.offers.length > 0 && G.sponsors.length < 2);
  badge("tabTeam", anyAura());
}

/* the shop screen groups the development tools in one place */
function scrDevelop() {
  closeAllDlg();
  const car = G.cars[G.teams[G.curTeam].car];
  let h = "<div class='small dim'>Research data: <b class='b'>" + Math.floor(G.rp) +
    " RP</b> · Money: <b class='g'>" + fmtK(G.money) + "</b></div><div class='mg' style='margin-top:8px'>" +
    "<button class='pill mi' onclick='scrResearch()'><span class='ico'>🔬</span>Research</button>" +
    "<button class='pill mi' onclick='scrParts()'><span class='ico'>🔧</span>Parts</button>" +
    "<button class='pill mi' onclick='scrBuild()'><span class='ico'>🛠</span>Build</button>" +
    "<button class='pill mi' onclick='scrTrain()'><span class='ico'>🏋</span>Training</button>" +
    "</div>";
  if (car) {
    const s = carStats(car);
    h += "<h4>Race machine</h4><div class='row'>" + carIcon(car) +
      "<div class='f1'><b class='b'>#" + car.num + " " + esc(car.name) + "</b> " + libTag("car", car.id) +
      "<div class='small dim'>Sp" + Math.floor(s.spd) + " Ac" + Math.floor(s.acc) + " Hd" + Math.floor(s.hdl) +
      " · parts " + car.parts.length + "/" + s.exp +
      " · condition " + Math.round(100 * car.dur / s.maxdur) + "%</div>" +
      bar(100 * car.dur / s.maxdur, car.dur < s.maxdur * 0.35 ? "d" : "") + "</div></div>";
  }
  h += "<div class='small dim' style='margin-top:8px'>Upgrades in Research are permanent — they raise every machine you build from that blueprint, and they carry into New Game+.</div>";
  dlg("Develop", h, [["Close", closeDlg]]);
}

</script>
<script>
/* ============================================================
   MAIN — boot, game loop, input
   ============================================================ */
"use strict";

let MODE = "title";        // title | shop | race
let weekAcc = 0, lastT = 0;
/* How fast the calendar runs at each setting.  Not linear on purpose —
   3x is for skipping a quiet stretch between races, so it is allowed to
   run a little hotter than three times one. */
const SPEED_MUL = { 1: 1, 2: 2.2, 3: 3.6 };

function enterRaceMode() {
  MODE = "race";
  $("objCard").classList.remove("on");
  $("tabbar").style.display = "none";
  $("speedBtn").classList.remove("on");
  $("order").classList.add("on");
  $("raceHud").style.display = "flex";
  $("auraBtn").style.display = "none";
}
function exitRaceMode() {
  MODE = "shop";
  $("tabbar").style.display = "flex";
  $("speedBtn").classList.add("on");
  $("order").classList.remove("on");
  $("raceHud").style.display = "none";
}

/* One draw failure used to mean a black screen forever: the frame threw,
   nothing was painted, and the next frame threw in the same place.  Now
   the first failure is reported on screen with its message, so a phone
   that cannot run something says so instead of going dark. */
let LOOP_ERR = 0;
function fatal(where, e) {
  if (LOOP_ERR++) return;
  const msg = (e && (e.message || e)) + "";
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;z-index:99;background:#0d1638;color:#fff;" +
    "font:12px/1.7 monospace;padding:18px;overflow:auto;-webkit-user-select:text;user-select:text";
  d.innerHTML = "<b style='color:#ffd23f'>Stock Car Story hit a problem</b><br><br>" +
    "<b>where:</b> " + where + "<br><b>error:</b> " + msg.replace(/</g, "&lt;") +
    "<br><br><span style='color:#9aa4bd'>Screenshot this and send it over — it says exactly " +
    "what your browser could not do.</span>";
  document.body.appendChild(d);
}
window.addEventListener("error", e => fatal("script", e.error || e.message));

function loop(ts) {
  requestAnimationFrame(loop);
  if (LOOP_ERR) return;
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
  lastT = ts; frame++;

  if (MODE === "title") {
    $("tabbar").style.display = "none"; $("speedBtn").classList.remove("on");
    try { drawTitle(); } catch (e) { fatal("title screen", e); }
    return;
  }
  if (!G) return;

  if (MODE === "race") {
    try {
      /* Run the simulation N times at the normal step instead of once at
         N times the step.  Feeding raceTick a triple-length dt would let
         cars pass through each other between frames; stepping keeps every
         overtake and every contact resolved exactly as it is at 1x. */
      if (R && !dlgStack.length && !G.set.paused) {
        const steps = clamp(G.set.speed | 0, 1, 3);
        for (let i = 0; i < steps && R; i++) raceTick(dt);
      }
      if (R) { drawRace(); updateRaceHud(); }
      else drawGarage();
    } catch (e) { fatal("race", e); }
    return;
  }
  /* shop: time flows unless a dialog is open or the player paused */
  if (!dlgStack.length && !G.set.paused) {
    weekAcc += dt * (SPEED_MUL[G.set.speed] || 1);
    if (weekAcc >= 1.5) {
      weekAcc = 0;
      advanceWeek();
      updateChrome();
      refreshObjective();
      if (!G.ended && G.year === 14 && G.month === 4) { G.ended = true; showEndgame(); }
    }
  }
  drawGarage();
  if (frame % 20 === 0) refreshObjective();
}

function updateRaceHud() {
  const me = R.field[0];
  const mb = $("modeBtn");
  if (mb) {
    const md = MODES[me.mode] || MODES.normal;
    mb.firstChild.nodeValue = md.ico;
    mb.querySelector("span").textContent = md.n.toLowerCase();
    mb.classList.toggle("push", me.mode === "push");
    mb.classList.toggle("conserve", me.mode === "conserve");
  }
  const pos = playerPos();
  $("posBadge").textContent = "P" + pos;
  $("lapBox").innerHTML = "LAP " + Math.min(me.lap + 1, R.laps) + "/" + R.laps +
    "<div class='hb2'><span>T</span><i style='width:" + Math.round(me.tyreLife) + "%'></i></div>" +
    "<div class='hb2 f'><span>F</span><i style='width:" + Math.round(me.fuel) + "%'></i></div>";
  $("spdBox").textContent = Math.round(me.v * MPH) + " mph";
  /* pit button state */
  const pb = $("pitBtn");
  pb.classList.toggle("armed", pitArmed());
  pb.firstChild.textContent = pitArmed() ? "BOX" : "PIT";
  pb.querySelector("span").textContent = pitArmed() ? "this lap" : "call stop";
  pb.disabled = R.phase !== "green";

  /* running order: the three ahead, you, and the one behind */
  const ord = raceOrder();
  const mi = ord.indexOf(me);
  const from = clamp(mi - 3, 0, Math.max(0, ord.length - 5));
  const slice = ord.slice(from, from + 5);
  $("order").innerHTML = slice.map((c, i) =>
    "<div class='o" + (c.isP ? " me" : "") + "'><b>" + (from + i + 1) + "</b>" +
    "<i style='background:" + c.col + "'></i><span>" + esc(c.name.split(" ")[0]) + "</span></div>").join("");

  const btn = $("auraBtn");
  if (R.auraTier && R.auraLeft > 0) {
    btn.style.display = "block";
    btn.disabled = R.phase !== "green";
    btn.style.background = "linear-gradient(" + AURAS[R.auraTier].col + ",#c98a00)";
  } else btn.style.display = "none";
}

/* ---------- boot ---------- */
function titleScreen() {
  MODE = "title";
  const btns = [];
  if (hasSave()) btns.push(["Continue", () => { closeDlg(); if (loadGame()) startShop(); else { newGame(false); startShop(); } }]);
  btns.push([hasSave() ? "New Game" : "Start Career", () => {
    closeDlg();
    if (hasSave()) dlg("Start over?", "Your current career will be overwritten.<br><span class='small dim'>Your developed machine and part library is kept.</span>",
      [["Yes", () => { closeDlg(); newGame(true); startShop(); }], ["Cancel", () => { closeDlg(); titleScreen(); }]]);
    else { newGame(true); startShop(); }
  }]);
  const lib = loadLibrary();
  const libN = Object.keys(lib.cars || {}).length + Object.keys(lib.parts || {}).length;
  dlg("STOCK CAR STORY",
    "<div style='text-align:center;line-height:1.9'>🏁<br>Hire drivers. Build machines.<br>Chase the championship.<br>" +
    "<span class='small dim'>Short tracks, superspeedways, road courses and street circuits.</span>" +
    (libN > 1 ? "<br><span class='small g'>Library: " + libN + " developed designs carry over</span>" : "") + "</div>",
    btns);
}
function startShop() {
  MODE = "shop";
  $("tabbar").style.display = "flex";
  $("speedBtn").classList.add("on");
  updateChrome();
  refreshObjective();
  if (!G.seenIntro) {
    G.seenIntro = true;
    dlg("Welcome, boss",
      "Pop's old <b class='b'>Backyard Garage</b> is yours — one tired Street Stocker, rookie driver " +
      "<b class='b'>Rusty Axles</b>, and <b class='b'>Gus Grease</b> on the wrenches.<br><br>" +
      "<span class='small'>· The <b class='b'>card at the top</b> always tells you what to do next — tap its button.<br>" +
      "· The <b class='b'>tabs</b> along the bottom are Team, Machines, Race, Develop and More.<br>" +
      "· <b class='b'>▶ SPEED</b> at the bottom-left runs the calendar; tap it to go faster or pause.<br>" +
      "· Tap things in the shop — the car, the crew, the banner — to open their screen.<br><br>" +
      "Before a race you pick <b>tyres and fuel</b>, and during it you call your own <b>pit stops</b>.</span>",
      [["Let's go racing", () => { closeDlg(); refreshObjective(); }]]);
  }
}

/* Pin the app to the viewport we can actually see.

   dvh is the right unit but it is not everywhere yet, and on a phone the
   difference is not cosmetic: vh is measured as though the address bar
   were hidden, so a vh-sized layout runs off the bottom of the screen and
   takes the tab bar with it.  Measuring the viewport directly is the one
   thing every browser agrees on, so that value wins over both units.

   visualViewport fires while the address bar slides, which the plain
   resize event does not. */
function syncAppHeight() {
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  if (h > 200) document.documentElement.style.setProperty("--appH", Math.round(h) + "px");
}

function boot() {
  syncAppHeight();
  window.addEventListener("resize", syncAppHeight);
  window.addEventListener("orientationchange", () => setTimeout(syncAppHeight, 250));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", syncAppHeight);
  initRender();
  /* Textures and the pixel-art button frames are both cosmetic.  If a
     browser cannot bake them the game should still be playable, so
     neither is allowed to stop boot. */
  try { buildTextures(); } catch (e) { console.warn("textures unavailable", e); }
  try { buildUIChrome(); } catch (e) { console.warn("ui chrome unavailable", e); }

  const tab = (id, fn) => { $(id).onclick = () => { if (MODE !== "shop") return; sfx("click"); fn(); }; };
  tab("tabTeam", scrTeam); tab("tabCars", scrCars); tab("tabRace", scrRaces);
  tab("tabShop", scrDevelop); tab("tabMore", openMenu);
  /* 1x -> 2x -> 3x -> paused, shared by the shop button and the race one
     so the game only has one idea of how fast time is running. */
  const cycleSpeed = () => {
    if (!G) return; sfx("click");
    if (G.set.paused) { G.set.paused = false; G.set.speed = 1; }
    else if (G.set.speed < 3) G.set.speed++;
    else { G.set.speed = 1; G.set.paused = true; }
    updateChrome();
  };
  $("speedBtn").onclick = cycleSpeed;
  $("raceSpeedBtn").onclick = cycleSpeed;
  $("auraBtn").onclick = fireAura;
  $("modeBtn").onclick = cycleMode;
  $("pitBtn").onclick = () => {
    if (!R || R.phase !== "green") return;
    sfx("click");
    if (pitArmed()) { cancelPit(); return; }
    dlg("Pit stop", "<div class='small'>What do you want done? A tyres-only or fuel-only stop is quicker " +
      "than taking both.</div>",
      [["Tyres", () => { closeAllDlg(); callPit("tyres"); }],
       ["Fuel", () => { closeAllDlg(); callPit("fuel"); }],
       ["Both", () => { closeAllDlg(); callPit("both"); }],
       ["Stay out", () => closeAllDlg()]]);
  };
  /* tapping the shop scene itself opens the matching screen */
  const canvasTap = ev => {
    if (MODE !== "shop" || dlgStack.length) return;
    const r = cv.getBoundingClientRect();
    const t = ev.changedTouches ? ev.changedTouches[0] : ev;
    const action = hitHotspot(t.clientX - r.left, t.clientY - r.top);
    if (action && window[action]) { sfx("click"); window[action](); }
  };
  $("scene").addEventListener("click", canvasTap);
  document.addEventListener("visibilitychange", () => { if (document.hidden && G && MODE === "shop") saveGame(); });
  window.addEventListener("pagehide", () => { if (G && MODE === "shop") saveGame(); });
  titleScreen();
  requestAnimationFrame(loop);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
    void 0;
}
window.addEventListener("load", boot);

</script>
</body>
</html>
